description: 'Data for the paper "Naturalistic behavior and self-generated neural
  activity predictive of self-correction" by Shijie Gu, Chenyan Liu, Anna K. Gillespie,
  Rhino Nevers, Eric L. Denovellis, Michael E. Coulter, Kenny Kay, and Loren M. Frank
  Hippocampus recording during rats changing their minds. Paper abstract: Changing
  one’s mind –– revising a past decision and independently of external cues –– can
  lead to better outcomes, but its neural basis remains poorly understood. We developed
  a challenging spatial task for rats where the conflict between task rules and innate
  biases leads to abundant, spontaneous, and characteristically corrective changes-of-mind
  (COMs). Neural recordings reveal a striking two-stage organization underlying COMs.
  In hippocampus, a brain region implicated in counterfactual thinking, spatial representations
  bifurcated around COM onset: representations of distant alternatives emerged only
  after animals began to change course. These representations predicted their eventual
  choice, and often serially encoded trial start and end locations. Our task paradigm
  reveals that the brain processes underlying self-correction are dissociable and
  uncovers a rich repertoire of hippocampal spatial representations tied to behavior.'
