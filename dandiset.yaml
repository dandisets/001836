description: "Data for the paper \"Naturalistic behavior and self-generated neural
  activity predictive of self-correction\" by \nShijie Gu, Chenyan Liu, Anna K. Gillespie,
  Rhino Nevers, Eric L. Denovellis, Michael E. Coulter, Kenny Kay, and Loren M. Frank\n
  \nHippocampus recording during rats changing their minds.\n\nPaper abstract:\nRevising
  a past decision is observed to be beneficial. It remains unclear what neural substrates
  constitute a “change-of-mind” in a context of more than one alternative. Here we
  report a prevalent change-of-mind behavior in freely behaving rats performing a
  challenging multi-alternative maze task: rats initially chose a maze arm before
  spontaneously leaving the arm and going to another arm. Critically, this behavior
  was predominantly corrective, and reflected rats overcoming their innate exploration
  bias. Using high-density neural recordings, we found that the hippocampus can represent
  an animal’s subsequent choice as they retreat from their initial choice. Intriguingly,
  the existence of neural activity led to better outcomes. Taken together, these findings
  delineate candidate neural activity patterns inducing and guiding self-correction
  behavior in a novel behavior paradigm. \n"
